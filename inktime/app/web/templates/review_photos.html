{% extends "base.html" %}
{% block title %}Review 工作台｜InkTime{% endblock %}
{% block head %}
<style>
  .review-toolbar{display:grid;grid-template-columns:2fr repeat(7,minmax(110px,1fr));gap:.6rem;align-items:end;margin:1rem 0}
  .review-toolbar label{display:grid;gap:.25rem;font-size:.8rem;color:var(--muted)}
  .review-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:1rem}
  .review-card{border:1px solid var(--border);border-radius:14px;background:var(--surface);overflow:hidden;display:grid;grid-template-rows:auto 1fr}
  .review-card.selected{outline:3px solid var(--accent)}
  .review-card img{width:100%;aspect-ratio:1.25;object-fit:cover;background:#111;display:block}
  .review-image-error{display:grid;place-items:center;min-height:10rem;padding:1rem;background:#171b18;color:var(--muted);text-align:center}
  .review-card-body{padding:.8rem;display:grid;gap:.35rem}
  .review-card-body small{color:var(--muted)}
  .review-actions{display:flex;flex-wrap:wrap;gap:.35rem;margin-top:.35rem}
  .review-actions button{font-size:.8rem}
  .review-card textarea{width:100%;min-height:3rem;resize:vertical}
  .review-status{min-height:1.4rem;color:var(--muted)}
  .review-summary{display:flex;gap:1rem;flex-wrap:wrap;color:var(--muted)}
  @media (max-width:800px){.review-toolbar{grid-template-columns:1fr 1fr}.review-toolbar label:first-child{grid-column:1/-1}}
</style>
{% endblock %}
{% block content %}
<div class="page-head"><div><p class="eyebrow">照片人工判讀</p><h1>Review 工作台</h1><p>縮圖、分析摘要與排除證據集中在同一個可恢復工作面；不載入原始照片、不改動來源檔。</p></div></div>
<form id="review-filter" class="review-toolbar">
  <label>搜尋<input name="q" placeholder="路徑片段"></label>
  <label>狀態<select name="review_state"><option value="">全部狀態</option><option value="unreviewed">未判讀</option><option value="keep">保留</option><option value="exclude">排除</option><option value="needs_review">待確認</option></select></label>
  <label>年份<input name="year" inputmode="numeric" maxlength="4" placeholder="2026"></label>
  <label>月份<input name="month" inputmode="numeric" maxlength="2" placeholder="06"></label>
  <label>日期<input name="day" inputmode="numeric" maxlength="2" placeholder="15"></label>
  <label>AI 狀態<select name="ai_status"><option value="">全部</option><option value="completed">已完成</option><option value="missing">未分析</option></select></label>
  <label>候選<select name="candidate_pool"><option value="">全部</option><option value="1">候選池</option><option value="0">非候選</option></select></label>
  <label>低信心<select name="low_confidence"><option value="">全部</option><option value="1">低於 0.60</option></select></label>
  <button>套用</button>
</form>
<div class="review-summary" id="review-summary" aria-live="polite">讀取中…</div>
<p class="review-status" id="review-status">快捷鍵：K 保留、X 排除、N 待確認、F 候選池、←/→ 選取卡片。篩選條件會保留在網址。</p>
<section class="review-grid" id="review-grid" aria-live="polite"></section>
<div style="display:flex;justify-content:center;margin:1.2rem"><button class="secondary" id="review-more" hidden>載入更多</button></div>
{% endblock %}
{% block scripts %}
<script nonce="{{ csp_nonce }}" src="{{ url_for('static', filename='review-workbench.js') }}"></script>
{% endblock %}
