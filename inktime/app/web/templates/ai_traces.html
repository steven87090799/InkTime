{% extends "base.html" %}
{% block title %}AI 即時追蹤｜InkTime{% endblock %}
{% block content %}
<div class="page-head"><div><p class="eyebrow">AI Analysis Inspector V2</p><h1>AI 即時追蹤</h1><p>只讀顯示真正送往 Provider 的已遮蔽請求、回應、解析、帳務與時間證據。</p></div><span class="status" id="poll-state">載入中</span></div>
<section class="panel"><form id="trace-filters" class="form-stack"><div class="settings-grid">
  <label>狀態<select name="status"><option value="">全部</option>{% for value in ['RUNNING','SUCCESS','FAILED','TIMEOUT','AMBIGUOUS'] %}<option value="{{ value }}" {% if request.args.get('status')==value %}selected{% endif %}>{{ value }}</option>{% endfor %}</select></label>
  <label>Provider<input name="provider" maxlength="128" value="{{ request.args.get('provider','') }}"></label>
  <label>Model<input name="model" maxlength="160" value="{{ request.args.get('model','') }}"></label>
  <label>Job ID<input name="job_id" maxlength="64" value="{{ request.args.get('job_id','') }}"></label>
  <label>照片 ID<input name="photo_id" maxlength="64" value="{{ request.args.get('photo_id','') }}"></label>
  <label>階段<input name="stage" maxlength="80" value="{{ request.args.get('stage','') }}"></label>
  <label>Trace ID<input name="trace_id" maxlength="160" value="{{ request.args.get('trace_id','') }}"></label>
</div><div class="inline-form"><button class="primary">套用篩選</button><button type="button" class="secondary" id="clear-traces">清除</button><button type="button" class="secondary" id="pause-traces">暫停</button></div></form></section>
<section class="panel"><div class="table-wrap"><table><thead><tr><th>照片</th><th>Trace</th><th>Provider / Model</th><th>狀態</th><th>時間</th><th>Token / Cost</th><th>Attempts</th></tr></thead><tbody id="trace-rows"></tbody></table></div><p class="empty" id="trace-empty" hidden>目前沒有符合條件的真實模型呼叫 Trace。</p></section>
{% endblock %}
{% block scripts %}<script nonce="{{ csp_nonce }}">
const traceForm=document.querySelector('#trace-filters'),traceRows=document.querySelector('#trace-rows'),traceEmpty=document.querySelector('#trace-empty'),traceState=document.querySelector('#poll-state'),pauseButton=document.querySelector('#pause-traces');let tracePaused=false,traceInFlight=false,traceTimer=null,traceRevision=0;
const traceEsc=value=>String(value??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const traceTime=value=>value?new Intl.DateTimeFormat(undefined,{dateStyle:'short',timeStyle:'medium'}).format(new Date(value)):'—';
function traceCost(row){if(row.cost_source==='unknown'||row.cost===null||row.cost===undefined)return 'unknown';return `US$ ${Number(row.cost).toFixed(6)} (${traceEsc(row.cost_source)})`;}
function renderTraceSnapshot(items){const html=items.map(row=>{const photo=row.photo_id?`<a href="/photos/${encodeURIComponent(row.photo_id)}"><img src="/api/v1/photos/${encodeURIComponent(row.photo_id)}/thumbnail" width="72" height="54" loading="lazy" alt="${traceEsc(row.relative_path||row.photo_id||'照片')}"></a>`:'<span class="empty">照片已清理</span>';return `<tr><td>${photo}<small>${traceEsc(row.relative_path||'—')}<br>${traceEsc(row.photo_id||'—')}</small></td><td><a href="/ai/traces/${encodeURIComponent(row.trace_id)}"><code>${traceEsc(row.trace_id)}</code></a><small>Job ${traceEsc(row.job_id||'—')} · ${traceEsc(row.stage||'—')}</small></td><td>${traceEsc(row.provider||'—')}<small>requested ${traceEsc(row.requested_model||'—')}<br>served ${traceEsc(row.served_model||'—')}</small></td><td><span class="status">${traceEsc(row.status)}</span><small>HTTP ${traceEsc(row.latest_http_status??'—')} · ${traceEsc(row.error_code||'—')}</small></td><td>${traceTime(row.started_at)}<small>${traceTime(row.completed_at)} · ${traceEsc(row.latency_ms??'—')} ms</small></td><td>${traceEsc(row.input_tokens||0)} / ${traceEsc(row.output_tokens||0)}<small>cached ${traceEsc(row.cached_tokens||0)} · ${traceCost(row)}</small></td><td>${traceEsc(row.attempt_count||0)}</td></tr>`;}).join('');const template=document.createElement('template');template.innerHTML=html;traceRows.replaceChildren(template.content);traceEmpty.hidden=items.length!==0;}
async function loadTraceSnapshot(){if(tracePaused||document.hidden||traceInFlight)return;traceInFlight=true;const revision=++traceRevision;const query=new URLSearchParams(new FormData(traceForm));query.set('limit','100');try{const response=await fetch('/api/v1/ai/traces?'+query);if(!response.ok)throw Error();const data=await response.json();if(revision!==traceRevision||tracePaused||document.hidden)return;renderTraceSnapshot(Array.isArray(data.traces)?data.traces:[]);traceState.textContent='正常';}catch(_error){if(revision===traceRevision)traceState.textContent='重新連線';}finally{traceInFlight=false;}}
function scheduleTracePoll(){if(traceTimer)clearTimeout(traceTimer);if(tracePaused||document.hidden)return;traceTimer=setTimeout(async()=>{await loadTraceSnapshot();scheduleTracePoll();},4000);}
traceForm.onsubmit=event=>{event.preventDefault();loadTraceSnapshot().finally(scheduleTracePoll)};document.querySelector('#clear-traces').onclick=()=>{traceForm.reset();loadTraceSnapshot().finally(scheduleTracePoll)};pauseButton.onclick=()=>{tracePaused=!tracePaused;traceRevision+=1;pauseButton.textContent=tracePaused?'繼續':'暫停';traceState.textContent=tracePaused?'暫停':'正常';scheduleTracePoll();if(!tracePaused)void loadTraceSnapshot();};document.addEventListener('visibilitychange',()=>{traceRevision+=1;scheduleTracePoll();if(!document.hidden)void loadTraceSnapshot();});loadTraceSnapshot().finally(scheduleTracePoll);
</script>{% endblock %}
