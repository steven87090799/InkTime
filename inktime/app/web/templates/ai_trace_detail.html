{% extends "base.html" %}
{% block title %}AI Trace {{ trace.trace_id }}｜InkTime{% endblock %}
{% block content %}
<div class="page-head"><div><p class="eyebrow">AI API Trace</p><h1><code>{{ trace.trace_id }}</code></h1><p><a href="/ai/traces">返回即時追蹤</a> · <a href="/photos/{{ trace.photo_id }}">查看照片完整資料</a>{% if trace.job_id %} · <a href="/jobs/{{ trace.job_id }}">查看分析工作</a>{% endif %}</p></div><span class="status" id="trace-detail-status">{{ trace.status }}</span></div>
<div id="trace-detail"><p class="empty">載入 Trace 詳情中…</p></div>
{% endblock %}
{% block scripts %}<script nonce="{{ csp_nonce }}">
const detailRoot=document.querySelector('#trace-detail');const detailEsc=value=>String(value??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));const detailJson=value=>detailEsc(JSON.stringify(value??null,null,2));const detailTime=value=>value?detailEsc(new Date(value).toLocaleString()):'—';
function promptPanel(attempt){if(!attempt.request)return`<p class="notice">完整 Prompt、Raw Request 與 Raw Response 僅限管理員查看。</p>`;const summary={provider:attempt.provider,model:attempt.model,endpoint:attempt.endpoint,api_mode:attempt.api_mode,max_tokens:attempt.request.max_tokens??null,temperature:attempt.request.temperature??null,reasoning:attempt.request.reasoning??attempt.request.reasoning_effort??null,response_format:attempt.response_format};return`<div class="trace-tabs"><button type="button" data-tab="pretty">Pretty</button><button type="button" data-tab="prompt">Prompt</button><button type="button" data-tab="raw">Raw JSON</button></div><div data-pane="pretty"><pre>${detailJson(summary)}</pre></div><div data-pane="prompt" hidden><h4>System Prompt</h4><pre>${detailEsc(attempt.system_prompt||'—')}</pre><h4>User Prompt</h4><pre>${detailEsc(attempt.user_prompt||'—')}</pre><h4>JSON Schema／Response Format</h4><pre>${detailJson(attempt.response_format)}</pre></div><div data-pane="raw" hidden><pre>${detailJson(attempt.request)}</pre></div>`;}
function renderDetail(trace){document.querySelector('#trace-detail-status').textContent=trace.status;const attempts=trace.attempts||[],exif=trace.exif||{};detailRoot.innerHTML=`<section class="metrics"><article><span>狀態</span><strong>${detailEsc(trace.status)}</strong></article><article><span>Provider／模型</span><strong>${detailEsc(trace.provider||'—')}<small>${detailEsc(trace.model||'—')}</small></strong></article><article><span>階段</span><strong>${detailEsc(trace.stage)}</strong></article><article><span>Attempts</span><strong>${attempts.length}</strong></article></section><section class="panel"><h2>Trace Identity</h2><div class="trace-meta-grid"><span>Prompt version <strong>${detailEsc(trace.prompt_version||'—')}</strong></span><span>Analysis fingerprint <strong>${detailEsc(trace.analysis_fingerprint||'—')}</strong></span><span>Started <strong>${detailTime(trace.started_at)}</strong></span><span>Response received <strong>${detailTime(trace.response_received_at)}</strong></span><span>Completed <strong>${detailTime(trace.completed_at)}</strong></span><span>Error <strong>${detailEsc(trace.error_code||'—')}</strong></span><span>Error message <strong>${detailEsc(trace.error_message||'—')}</strong></span></div></section><section class="panel trace-photo"><div><h2>Photo</h2><img loading="lazy" src="${detailEsc(trace.image_url)}" alt="${detailEsc(trace.relative_path)}"></div><dl><dt>Photo ID</dt><dd><a href="${detailEsc(trace.photo_url)}"><code>${detailEsc(trace.photo_id)}</code></a></dd><dt>路徑</dt><dd>${detailEsc(trace.relative_path)}</dd><dt>尺寸</dt><dd>${detailEsc(trace.width||'—')} × ${detailEsc(trace.height||'—')}</dd><dt>MIME</dt><dd>${detailEsc(trace.mime_type||'—')}</dd><dt>SHA-256</dt><dd><code>${detailEsc(trace.sha256||'—')}</code></dd><dt>captured_at</dt><dd>${detailTime(trace.captured_at)}</dd><dt>相機</dt><dd>${detailEsc([exif.camera_make,exif.camera_model].filter(Boolean).join(' ')||'—')}</dd><dt>鏡頭</dt><dd>${detailEsc(exif.lens_model||'—')}</dd></dl></section>${attempts.map(attempt=>`<section class="panel trace-attempt"><div class="panel-head"><h2>Attempt ${attempt.attempt_number} · ${detailEsc(attempt.result||attempt.status)}</h2><span class="status">${detailEsc(attempt.status)}</span></div><div class="trace-meta-grid"><span>Provider <strong>${detailEsc(attempt.provider)}</strong></span><span>Model <strong>${detailEsc(attempt.model)}</strong></span><span>Endpoint <strong>${detailEsc(attempt.endpoint||'—')}</strong></span><span>HTTP <strong>${detailEsc(attempt.http_status||'—')}</strong></span><span>Latency <strong>${detailEsc(attempt.latency_ms??'—')} ms</strong></span><span>Request ID <strong>${detailEsc(attempt.provider_request_id||'—')}</strong></span><span>Started <strong>${detailTime(attempt.started_at)}</strong></span><span>Request built <strong>${detailTime(attempt.request_built_at)}</strong></span><span>Response received <strong>${detailTime(attempt.response_received_at)}</strong></span><span>Completed <strong>${detailTime(attempt.completed_at)}</strong></span><span>Retry reason <strong>${detailEsc(attempt.retry_reason||'—')}</strong></span><span>Retry delay <strong>${detailEsc(attempt.retry_delay_ms??'—')} ms</strong></span><span>Error <strong>${detailEsc(attempt.error_code||'—')}</strong></span><span>Error message <strong>${detailEsc(attempt.error_message||'—')}</strong></span></div><h3>INPUT</h3>${promptPanel(attempt)}<h3>Raw Model Output</h3>${attempt.response_raw!==null?`<pre>${detailEsc(attempt.response_raw||'—')}</pre>`:`<p class="notice">Raw Response 僅限管理員查看。</p>`}<h3>Parsed Output</h3><pre>${detailJson(attempt.response_parsed)}</pre><h3>USAGE</h3><div class="trace-meta-grid"><span>Input <strong>${Number(attempt.input_tokens||0)}</strong></span><span>Output <strong>${Number(attempt.output_tokens||0)}</strong></span><span>Cached <strong>${Number(attempt.cached_tokens||0)}</strong></span><span>Reasoning <strong>${Number(attempt.reasoning_tokens||0)}</strong></span><span>總 Token <strong>${Number(attempt.input_tokens||0)+Number(attempt.output_tokens||0)}</strong></span><span>成本 <strong>${attempt.cost===null||attempt.cost===undefined?'unknown':`${detailEsc(attempt.cost_source)} US$ ${Number(attempt.cost).toFixed(6)}`}</strong></span></div></section>`).join('')}<section class="panel"><h2>Final Stored Result</h2><p>模型輸出經 schema validation、校準、評分與 normalization 後真正寫入的結果。</p><pre>${detailJson(trace.final_result)}</pre></section><section class="panel"><h2>EVENTS</h2><div class="activity-timeline">${(trace.events||[]).map(event=>`<article class="activity-event"><div class="activity-marker">${detailEsc(event.event_type)}</div><div class="activity-body"><strong>${detailEsc(event.event_type)}</strong><small>${detailTime(event.created_at)} · Attempt ${detailEsc(event.attempt_id||'—')}</small><pre>${detailJson(event.details)}</pre></div></article>`).join('')||'<p class="empty">沒有事件。</p>'}</div></section>`;detailRoot.querySelectorAll('.trace-tabs').forEach(tabs=>tabs.querySelectorAll('button').forEach(button=>button.onclick=()=>{const section=tabs.parentElement;section.querySelectorAll('[data-pane]').forEach(pane=>pane.hidden=pane.dataset.pane!==button.dataset.tab);}));}
fetch('/api/v1/ai/traces/{{ trace.trace_id }}').then(response=>{if(!response.ok)throw Error();return response.json();}).then(data=>renderDetail(data.trace)).catch(()=>{detailRoot.innerHTML='<p class="notice error">Trace 詳情載入失敗。</p>';});
</script>{% endblock %}
