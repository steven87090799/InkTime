[project]
name = "inktime"
dynamic = ["version"]
requires-python = ">=3.10"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = {attr = "inktime._version.__version__"}

[tool.ruff]
target-version = "py310"
line-length = 110
exclude = ["legacy_server.py", "legacy_analyze_photos.py", "render_daily_photo.py", "render_daily_photo_133c.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S107"]
"inktime/app/repositories/jobs.py" = ["S608"]
"inktime/app/repositories/photos.py" = ["S608"]
"scripts/*.py" = ["E402"]

[tool.coverage.run]
# The benchmark harness has its own offline contract job; keep the production
# application coverage gate scoped to runtime application code.
omit = ["*/inktime/app/services/model_benchmark.py"]

[tool.mypy]
python_version = "3.10"
files = [
  "inktime",
  "server.py",
  "analyze_photos.py",
  "scripts/container_health.py",
  "scripts/migrate.py",
  "scripts/restore_backup.py",
  "scripts/production_preflight.py",
  "scripts/check_dependency_policy.py",
  "scripts/runtime_soak.py",
  "scripts/lan_production_gate.py",
]
ignore_missing_imports = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["legacy_server", "render_daily_photo", "render_daily_photo_133c"]
ignore_errors = true
