name: inktime

# NAS 正式部署只拉取 GitHub Container Registry 映像，不在 NAS 上建置原始碼。
x-common: &common
  image: ${INKTIME_IMAGE_REPOSITORY:-ghcr.io/steven87090799/inktime}:${INKTIME_IMAGE_TAG:-latest}
  pull_policy: always
  restart: unless-stopped
  init: true
  stop_grace_period: 45s
  environment:
    INKTIME_ENVIRONMENT: production
    INKTIME_DATA_DIR: /data
    INKTIME_DATABASE: /data/inktime.db
    INKTIME_PHOTO_DIR: /photos
    INKTIME_RELEASE_DIR: /data/releases
    INKTIME_BACKUP_DIR: /data/backups
    INKTIME_CACHE_DIR: /data/cache
    INKTIME_HOST: 0.0.0.0
    INKTIME_PORT: 8765
    INKTIME_TIMEZONE: ${TZ:-Asia/Taipei}
    INKTIME_PROXY_TRUST: ${INKTIME_PROXY_TRUST:-0}
    INKTIME_WORKER_CONCURRENCY: ${INKTIME_WORKER_CONCURRENCY:-2}
    INKTIME_SCHEDULER_IDENTITY: ${INKTIME_SCHEDULER_IDENTITY:-inktime-scheduler}
    TZ: ${TZ:-Asia/Taipei}
    INKTIME_COOKIE_SECURE: ${INKTIME_COOKIE_SECURE:-1}
    INKTIME_PUBLIC_URL: ${INKTIME_PUBLIC_URL:?請在 .env.nas 設定實際 INKTIME_PUBLIC_URL}
    INKTIME_ALLOW_INSECURE_HTTP: ${INKTIME_ALLOW_INSECURE_HTTP:-0}
    INKTIME_ALLOW_UNSAFE_NETWORK_DATABASE: ${INKTIME_ALLOW_UNSAFE_NETWORK_DATABASE:-0}
    INKTIME_LOG_FORMAT: ${INKTIME_LOG_FORMAT:-json}
    INKTIME_LOG_LEVEL: ${INKTIME_LOG_LEVEL:-INFO}
    INKTIME_ACCESS_LOG: ${INKTIME_ACCESS_LOG:-0}
    INKTIME_ENABLE_LEGACY_WEBUI: ${INKTIME_ENABLE_LEGACY_WEBUI:-false}
  volumes:
    # SQLite、Session Key、快取、備份與 Release 必須持久保存。
    - ${INKTIME_DATA_PATH:?請在 .env.nas 設定 INKTIME_DATA_PATH}:/data
    # 原始照片固定唯讀，容器更新不會修改 NAS 相簿。
    - ${INKTIME_PHOTO_PATH:?請在 .env.nas 設定 INKTIME_PHOTO_PATH}:/photos:ro
  read_only: true
  tmpfs:
    - /tmp:size=256m,mode=1777
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: ${INKTIME_LOG_MAX_SIZE:-5m}
      max-file: ${INKTIME_LOG_MAX_FILES:-3}

services:
  inktime-web:
    <<: *common
    ports:
      - "${INKTIME_BIND_ADDRESS:-127.0.0.1}:${INKTIME_PORT:-8765}:8765"
    cpus: ${INKTIME_WEB_CPUS:-0.75}
    mem_limit: ${INKTIME_WEB_MEMORY:-384m}
    pids_limit: ${INKTIME_WEB_PIDS:-128}
    tmpfs:
      - /tmp:size=128m,mode=1777

  inktime-worker:
    <<: *common
    command: ["python", "-m", "inktime.app.workers.runner"]
    healthcheck:
      test: ["CMD", "python", "scripts/container_health.py", "worker"]
      interval: 2m
      timeout: 5s
      start_period: 20s
      retries: 3
    depends_on:
      inktime-web:
        condition: service_healthy
    cpus: ${INKTIME_WORKER_CPUS:-2.0}
    mem_limit: ${INKTIME_WORKER_MEMORY:-1g}
    pids_limit: ${INKTIME_WORKER_PIDS:-192}
    tmpfs:
      - /tmp:size=256m,mode=1777

  inktime-scheduler:
    <<: *common
    command: ["python", "-m", "inktime.app.workers.scheduler"]
    healthcheck:
      test: ["CMD", "python", "scripts/container_health.py", "scheduler"]
      interval: 2m
      timeout: 5s
      start_period: 20s
      retries: 3
    depends_on:
      inktime-web:
        condition: service_healthy
    cpus: ${INKTIME_SCHEDULER_CPUS:-0.25}
    mem_limit: ${INKTIME_SCHEDULER_MEMORY:-192m}
    pids_limit: ${INKTIME_SCHEDULER_PIDS:-64}
    tmpfs:
      - /tmp:size=64m,mode=1777
