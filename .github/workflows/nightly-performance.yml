name: InkTime Nightly Performance

on:
  workflow_dispatch:
  schedule:
    - cron: "20 18 * * 0"

permissions:
  contents: read

jobs:
  synthetic-scale:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node 24)
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0 (Node 24)
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements-dev.txt
      - run: mkdir -p artifacts
      - run: pytest -q tests/performance tests/integration/test_final_review_history.py
      - run: python scripts/performance_100k.py --output artifacts/performance-100k.md
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: inktime-nightly-performance-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 30
