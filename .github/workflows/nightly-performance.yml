name: InkTime Nightly Performance

on:
  workflow_dispatch:
  schedule:
    - cron: "20 18 * * 0"

permissions:
  contents: read

jobs:
  synthetic-scale:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node 24)
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0 (Node 24)
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements-dev.txt
      - run: mkdir -p artifacts
      - run: pytest -q tests/performance tests/integration/test_final_review_history.py
      - run: python scripts/performance_100k.py --output artifacts/performance-100k.md
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: inktime-nightly-performance-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 30
