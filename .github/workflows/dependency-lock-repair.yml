name: Repair Dependabot runtime locks

"on":
  workflow_run:
    workflows: [InkTime CI]
    types: [completed]

concurrency:
  group: dependency-lock-repair-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: read

jobs:
  repair:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      startsWith(github.event.workflow_run.head_branch, 'dependabot/pip/') &&
      (github.event.workflow_run.conclusion == 'failure' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Execute only the trusted default branch; PR contents are parsed as pin data.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: {python-version: "3.12", cache: pip}
      - run: python -m pip install packaging==25.0
      - name: Validate PR identity and repair target wheel locks
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/ci/repair_dependency_locks.py
