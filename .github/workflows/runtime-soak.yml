name: InkTime Parameterized Runtime Soak

on:
  workflow_dispatch:
    inputs:
      duration_seconds:
        description: GitHub-hosted bounded duration
        required: true
        default: "7200"
        type: choice
        options: ["1800", "7200", "18000"]

permissions:
  contents: read

jobs:
  long-runtime-soak:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node 24)
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.0.0 (Node 24)
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements-dev.txt
      - name: Run bounded long soak
        run: |
          mkdir -p .artifacts
          python scripts/runtime_soak.py \
            --duration-seconds '${{ inputs.duration_seconds }}' \
            --max-iterations 100000 \
            --timeout-seconds 21600 \
            --summary-json .artifacts/runtime-soak.json
      - name: Upload summary even on failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 (Node 24)
        with:
          name: runtime-soak-summary
          path: .artifacts/runtime-soak.json
          if-no-files-found: error
          retention-days: 14
