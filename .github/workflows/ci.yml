name: InkTime CI

on:
  push:
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  python-quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node 24)
        with: {fetch-depth: 0}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0 (Node 24)
        with: {python-version: "${{ matrix.python-version }}", cache: pip}
      - run: pip install -r requirements-dev.txt
      - run: ruff check inktime tests scripts server.py analyze_photos.py
      - run: mypy inktime
      - run: pytest --cov=inktime --cov-report=term-missing --cov-fail-under=80 tests/unit tests/security tests/integration
      - run: pytest tests/unit/test_migrations.py
      - run: pip-audit -r requirements.txt

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node 24)
        with: {fetch-depth: 0}
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0 (Node 24)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  compose-production-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node 24)
      - name: Prepare isolated production smoke environment
        run: |
          mkdir -p .ci-data .ci-photos
          chmod 777 .ci-data
          cat > .ci.env <<'EOF'
          TZ=Asia/Taipei
          INKTIME_PORT=8765
          INKTIME_DATA_PATH=.ci-data
          INKTIME_PHOTO_PATH=.ci-photos
          INKTIME_ENVIRONMENT=production
          INKTIME_PUBLIC_URL=http://inktime-ci.acme.dev:8765
          INKTIME_COOKIE_SECURE=0
          INKTIME_ALLOW_INSECURE_HTTP=1
          INKTIME_ALLOW_UNSAFE_NETWORK_DATABASE=0
          INKTIME_PROXY_TRUST=0
          INKTIME_IMAGE_TAG=ci
          EOF
      - name: Build and start Web, Worker and Scheduler
        run: docker compose --env-file .ci.env up -d --build
      - name: Wait for all service healthchecks
        run: |
          timeout 180 sh -c '
            until
              curl -fsS http://127.0.0.1:8765/health/ready >/dev/null &&
              docker compose --env-file .ci.env exec -T inktime-worker python scripts/container_health.py worker &&
              docker compose --env-file .ci.env exec -T inktime-scheduler python scripts/container_health.py scheduler
            do sleep 2; done
          '
      - name: Verify setup, login, worker job and scheduler heartbeat
        run: python scripts/production_compose_smoke.py
      - name: Verify runtime identity, permissions and image contents
        run: |
          docker compose --env-file .ci.env exec -T inktime-web sh -c '
            test "$(id -u)" = 10001
            test -w /data
            ! touch /app/.ci-write-test
            ! python -m pip --version
            test ! -e /app/tests
            test ! -e /app/.github
            test ! -e /app/docs
            test ! -e /app/.env
            test ! -e /app/esp32
          '
      - name: Collect Compose diagnostics
        if: failure()
        run: |
          docker compose --env-file .ci.env ps
          docker compose --env-file .ci.env logs --no-color
          docker compose --env-file .ci.env ps --format json
      - name: Remove smoke volumes and containers
        if: always()
        run: docker compose --env-file .ci.env down -v --remove-orphans

  compose-production-tls-smoke:
    runs-on: ubuntu-latest
    env:
      NO_PROXY: inktime-ci.acme.dev,127.0.0.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node 24)
      - name: Create isolated test CA and server certificate
        shell: bash
        run: |
          mkdir -p .ci-data .ci-photos .ci-tls
          chmod 777 .ci-data
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -subj '/CN=InkTime CI Test CA' \
            -keyout .ci-tls/ca.key -out .ci-tls/ca.crt
          openssl req -newkey rsa:2048 -nodes \
            -subj '/CN=inktime-ci.acme.dev' \
            -keyout .ci-tls/server.key -out .ci-tls/server.csr
          printf 'subjectAltName=DNS:inktime-ci.acme.dev\nextendedKeyUsage=serverAuth\n' > .ci-tls/server.ext
          openssl x509 -req -days 1 -sha256 \
            -in .ci-tls/server.csr -CA .ci-tls/ca.crt -CAkey .ci-tls/ca.key \
            -CAcreateserial -extfile .ci-tls/server.ext -out .ci-tls/server.crt
          echo '127.0.0.1 inktime-ci.acme.dev' | sudo tee -a /etc/hosts
          cat > .ci-tls.env <<'EOF'
          TZ=Asia/Taipei
          INKTIME_DATA_PATH=.ci-data
          INKTIME_PHOTO_PATH=.ci-photos
          INKTIME_ENVIRONMENT=production
          INKTIME_PUBLIC_URL=https://inktime-ci.acme.dev:8443
          INKTIME_COOKIE_SECURE=1
          INKTIME_ALLOW_INSECURE_HTTP=0
          INKTIME_ALLOW_UNSAFE_NETWORK_DATABASE=0
          INKTIME_PROXY_TRUST=1
          INKTIME_IMAGE_TAG=ci-tls
          EOF
      - name: Build and start production services behind TLS proxy
        run: docker compose --env-file .ci-tls.env -f docker-compose.yml -f .github/tls-smoke/docker-compose.tls.yml up -d --build
      - name: Wait for verified HTTPS readiness
        run: |
          timeout 180 sh -c '
            until curl --fail --silent --show-error \
              --cacert .ci-tls/ca.crt \
              --resolve inktime-ci.acme.dev:8443:127.0.0.1 \
              https://inktime-ci.acme.dev:8443/health/ready >/dev/null
            do sleep 2; done
          '
          if curl --fail --silent http://127.0.0.1:8765/health/live; then
            echo 'Backend port must not be published in TLS topology' >&2
            exit 1
          fi
      - name: Verify redirect, trusted TLS, cookies, CSRF, session, HSTS and proxy diagnostics
        env:
          INKTIME_TLS_SMOKE_CA: .ci-tls/ca.crt
          INKTIME_TLS_SMOKE_URL: https://inktime-ci.acme.dev:8443
          INKTIME_TLS_SMOKE_HTTP_URL: http://inktime-ci.acme.dev:8080
        run: python scripts/production_tls_smoke.py
      - name: Collect TLS Compose diagnostics
        if: failure()
        run: |
          docker compose --env-file .ci-tls.env -f docker-compose.yml -f .github/tls-smoke/docker-compose.tls.yml ps
          docker compose --env-file .ci-tls.env -f docker-compose.yml -f .github/tls-smoke/docker-compose.tls.yml logs --no-color
      - name: Remove TLS smoke volumes, containers and certificates
        if: always()
        run: |
          docker compose --env-file .ci-tls.env -f docker-compose.yml -f .github/tls-smoke/docker-compose.tls.yml down -v --remove-orphans
          sudo rm -rf .ci-tls .ci-data .ci-photos

  bounded-runtime-soak:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node 24)
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0 (Node 24)
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements-dev.txt
      - run: timeout 240 python scripts/runtime_soak.py --iterations 30 --timeout-seconds 180

  playwright:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node 24)
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0 (Node 24)
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt pytest playwright
      - run: playwright install --with-deps chromium
      - run: mkdir -p .ci-e2e && INKTIME_DATA_DIR=.ci-e2e INKTIME_DATABASE=.ci-e2e/inktime.db gunicorn --bind 127.0.0.1:8765 server:app &
      - run: timeout 60 sh -c 'until curl -fsS http://127.0.0.1:8765/health/live; do sleep 1; done'
      - run: INKTIME_E2E_URL=http://127.0.0.1:8765 pytest tests/e2e

  esp32-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node 24)
      - uses: arduino/setup-arduino-cli@81d310742121c928ea9c8bbd407b4217b432ae02 # v2.0.0
      - run: arduino-cli config init
      - run: arduino-cli core update-index && arduino-cli core install esp32:esp32@3.3.10
      - run: arduino-cli lib install GxEPD2@1.6.9 ArduinoJson@7.4.3
      - name: Test profile, palette, rotation and cache primitives
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror -pedantic -Iesp32/ink-display-7C-photo tests/firmware/test_photopainter_core.cpp -o /tmp/inktime-core-default
          /tmp/inktime-core-default
          c++ -std=c++17 -Wall -Wextra -Werror -pedantic -DDEVICE_PROFILE=DEVICE_PROFILE_WAVESHARE_PHOTOPAINTER -Iesp32/ink-display-7C-photo tests/firmware/test_photopainter_core.cpp -o /tmp/inktime-core-photopainter
          /tmp/inktime-core-photopainter
          c++ -std=c++17 -Wall -Wextra -Werror -pedantic -Iesp32/ink-display-7C-photo tests/firmware/test_queue_client_core.cpp -o /tmp/inktime-queue-core
          /tmp/inktime-queue-core
      - name: Existing default GDEY release
        run: arduino-cli compile --fqbn 'esp32:esp32:esp32s3' --build-path /tmp/build-existing-release esp32/ink-display-7C-photo
      - name: Existing default PCB with GDEP release
        run: arduino-cli compile --fqbn 'esp32:esp32:esp32s3' --build-property 'compiler.cpp.extra_flags=-DINKTIME_PANEL_GDEP073E01=1' --build-path /tmp/build-existing-gdep-release esp32/ink-display-7C-photo
      - name: Waveshare PhotoPainter release
        run: arduino-cli compile --fqbn 'esp32:esp32:esp32s3:FlashSize=16M,PartitionScheme=app3M_fat9M_16MB,PSRAM=opi,CDCOnBoot=cdc' --build-property 'compiler.cpp.extra_flags=-DDEVICE_PROFILE=DEVICE_PROFILE_WAVESHARE_PHOTOPAINTER' --build-path /tmp/build-photopainter-release esp32/ink-display-7C-photo
      - name: Trusted LAN GDEY release
        run: arduino-cli compile --fqbn 'esp32:esp32:esp32s3' --build-property 'compiler.cpp.extra_flags=-DINKTIME_ALLOW_INSECURE_DEVICE_HTTP=1' --build-path /tmp/build-existing-lan esp32/ink-display-7C-photo
      - name: Trusted LAN GDEP release
        run: arduino-cli compile --fqbn 'esp32:esp32:esp32s3' --build-property 'compiler.cpp.extra_flags=-DINKTIME_PANEL_GDEP073E01=1 -DINKTIME_ALLOW_INSECURE_DEVICE_HTTP=1' --build-path /tmp/build-gdep-lan esp32/ink-display-7C-photo
      - name: Trusted LAN Waveshare PhotoPainter release
        run: arduino-cli compile --fqbn 'esp32:esp32:esp32s3:FlashSize=16M,PartitionScheme=app3M_fat9M_16MB,PSRAM=opi,CDCOnBoot=cdc' --build-property 'compiler.cpp.extra_flags=-DDEVICE_PROFILE=DEVICE_PROFILE_WAVESHARE_PHOTOPAINTER -DINKTIME_ALLOW_INSECURE_DEVICE_HTTP=1' --build-path /tmp/build-photopainter-lan esp32/ink-display-7C-photo
      - name: Existing default debug
        run: arduino-cli compile --fqbn 'esp32:esp32:esp32s3:DebugLevel=debug' --build-property 'compiler.cpp.extra_flags=-DINKTIME_DEBUG_LOG=1' --build-path /tmp/build-existing-debug esp32/ink-display-7C-photo
      - name: Waveshare PhotoPainter debug
        run: arduino-cli compile --fqbn 'esp32:esp32:esp32s3:FlashSize=16M,PartitionScheme=app3M_fat9M_16MB,PSRAM=opi,CDCOnBoot=cdc,DebugLevel=debug' --build-property 'compiler.cpp.extra_flags=-DDEVICE_PROFILE=DEVICE_PROFILE_WAVESHARE_PHOTOPAINTER -DINKTIME_DEBUG_LOG=1' --build-path /tmp/build-photopainter-debug esp32/ink-display-7C-photo
