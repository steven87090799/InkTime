name: InkTime CI

"on":
  pull_request:
    branches:
      - main
    # Base retargets need validation; title/body-only edits use the metadata lane below.
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled, edited]
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      full_suite:
        description: Run every hosted validation tier
        required: false
        default: true
        type: boolean
      base_sha:
        description: Optional base commit SHA for manual provenance and diff planning
        required: false
        default: ""
        type: string

concurrency:
  group: inktime-ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name == 'pull_request' && github.event.action == 'edited' && github.event.changes.base == null && 'metadata-only' || 'validation' }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Classify changed paths and validation provenance
    runs-on: ubuntu-latest
    outputs:
      full_validation: ${{ steps.event.outputs.full_validation }}
      ci_mode: ${{ steps.route.outputs.ci_mode }}
      selected_test_suites: ${{ steps.route.outputs.selected_test_suites }}
      selected_gates: ${{ steps.route.outputs.selected_gates }}
      skipped_gates: ${{ steps.route.outputs.skipped_gates }}
      plan_json: ${{ steps.route.outputs.plan_json }}
      run_python_quality: ${{ steps.route.outputs.run_python_quality }}
      run_dependency_policy: ${{ steps.route.outputs.run_dependency_policy }}
      selected_owner_suites: ${{ steps.route.outputs.selected_owner_suites }}
      run_python312_full: ${{ steps.route.outputs.run_python312_full }}
      run_python310: ${{ steps.route.outputs.run_python310 }}
      run_dependency_audit: ${{ steps.route.outputs.run_dependency_audit }}
      run_migration: ${{ steps.route.outputs.run_migration }}
      run_secret_scan: ${{ steps.route.outputs.run_secret_scan }}
      run_actionlint: ${{ steps.route.outputs.run_actionlint }}
      run_lan_persistence: ${{ steps.route.outputs.run_lan_persistence }}
      run_tls_smoke: ${{ steps.route.outputs.run_tls_smoke }}
      run_runtime_soak: ${{ steps.route.outputs.run_runtime_soak }}
      run_playwright: ${{ steps.route.outputs.run_playwright }}
      run_firmware_host_contract: ${{ steps.route.outputs.run_firmware_host_contract }}
      run_firmware_compile: ${{ steps.route.outputs.run_firmware_compile }}
      run_benchmark: ${{ steps.route.outputs.run_benchmark }}
      run_container_security: ${{ steps.route.outputs.run_container_security }}
      run_source_head_contract: ${{ steps.route.outputs.run_source_head_contract }}
      firmware_execution_profiles: ${{ steps.route.outputs.firmware_execution_profiles }}
      full_plan_complete: ${{ steps.route.outputs.full_plan_complete }}
      no_heavy_impact_duplicates: ${{ steps.route.outputs.no_heavy_impact_duplicates }}
      source_head_sha: ${{ steps.route.outputs.source_head_sha }}
      base_sha: ${{ steps.route.outputs.base_sha }}
      tested_sha: ${{ steps.route.outputs.tested_sha }}
      tested_ref: ${{ steps.route.outputs.tested_ref }}
      tested_ref_kind: ${{ steps.route.outputs.tested_ref_kind }}
    steps:
      - id: event
        name: Classify workflow event
        env:
          FULL_VALIDATION: ${{ github.event_name != 'pull_request' || github.event.action != 'edited' || github.event.changes.base != null }}
        run: echo "full_validation=${FULL_VALIDATION}" >> "${GITHUB_OUTPUT}"
      # pull_request intentionally retains GitHub's merge-ref checkout for
      # pre-merge compatibility validation; provenance is emitted separately.
      - if: ${{ steps.event.outputs.full_validation == 'true' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node 24)
        with: {fetch-depth: 0}
      - id: route
        name: Emit canonical source-owned plan and tested checkout provenance
        if: ${{ steps.event.outputs.full_validation == 'true' }}
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          BASE_SHA_INPUT: ${{ inputs.base_sha || '' }}
          SOURCE_HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          PR_DRAFT: ${{ github.event_name == 'pull_request' && toJSON(github.event.pull_request.draft) || '' }}
          FULL_SUITE_INPUT: ${{ inputs.full_suite || '' }}
          FULL_CI_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'full-ci') }}
        run: |
          set -euo pipefail
          source_head_sha="${SOURCE_HEAD_SHA:-${GITHUB_SHA}}"
          base_sha=""
          explicit_dispatch_base="false"
          case "${GITHUB_EVENT_NAME}" in
            pull_request|push)
              # These event payloads are authoritative; invalid or missing
              # values must fail closed instead of being guessed.
              base_sha="${BASE_SHA:-}"
              ;;
            workflow_dispatch)
              if [ -n "${BASE_SHA_INPUT:-}" ]; then
                base_sha="${BASE_SHA_INPUT}"
                explicit_dispatch_base="true"
              else
                default_base="refs/remotes/origin/main"
                if ! git cat-file -e "${default_base}^{commit}" 2>/dev/null; then
                  echo "workflow_dispatch requires ${default_base} when base_sha is omitted." >&2
                  exit 1
                fi
                if ! base_sha="$(git merge-base "${source_head_sha}" "${default_base}")"; then
                  echo "Unable to establish workflow_dispatch merge-base from ${default_base}." >&2
                  exit 1
                fi
              fi
              ;;
            *)
              echo "Unsupported event ${GITHUB_EVENT_NAME}; refusing implicit base provenance." >&2
              exit 1
              ;;
          esac
          if ! printf '%s\n' "${base_sha}" | grep -Eq '^[0-9a-fA-F]{40}$'; then
            echo "Base commit must be a complete 40-character SHA (event=${GITHUB_EVENT_NAME})." >&2
            exit 1
          fi
          if [ "${base_sha}" = "0000000000000000000000000000000000000000" ]; then
            echo "Base commit cannot be the all-zero event.before SHA." >&2
            exit 1
          fi
          if ! git cat-file -e "${base_sha}^{commit}" 2>/dev/null; then
            echo "Base commit object ${base_sha} is unavailable." >&2
            exit 1
          fi
          if [ "${explicit_dispatch_base}" = "true" ] && ! git merge-base --is-ancestor "${base_sha}" "${source_head_sha}"; then
            echo "workflow_dispatch base_sha ${base_sha} is not an ancestor of source HEAD ${source_head_sha}." >&2
            exit 1
          fi
          tested_sha="$(git rev-parse HEAD)"
          tested_ref="${GITHUB_REF}"
          case "${GITHUB_EVENT_NAME}" in
            pull_request) tested_ref_kind="merge-ref" ;;
            push)
              if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
                tested_ref_kind="main"
              else
                tested_ref_kind="head"
              fi
              ;;
            *) tested_ref_kind="head" ;;
          esac
          provenance_json="$(python scripts/ci/provenance.py \
            --event-name "${GITHUB_EVENT_NAME}" \
            --ref "${GITHUB_REF}" \
            --source-head-sha "${source_head_sha}" \
            --base-sha "${base_sha}" \
            --tested-sha "${tested_sha}" \
            --tested-ref "${tested_ref}" \
            --tested-ref-kind "${tested_ref_kind}")"
          jq -e . >/dev/null <<<"${provenance_json}"
          head_sha="${source_head_sha}"
          git diff --name-only "${base_sha}...${head_sha}" -- > .ci-changed-paths.txt
          draft_args=()
          if [ -n "${PR_DRAFT}" ]; then draft_args+=(--draft "${PR_DRAFT}"); fi
          full_suite_args=()
          if [ "${FULL_SUITE_INPUT}" = "true" ]; then full_suite_args+=(--full-suite); fi
          label_args=()
          if [ "${FULL_CI_LABEL}" = "true" ]; then label_args+=(--label full-ci); fi
          plan_json="$(python scripts/ci/canonical_plan.py \
            --paths-file .ci-changed-paths.txt \
            --event-name "${GITHUB_EVENT_NAME}" \
            --ref "${GITHUB_REF}" \
            --base-sha "${base_sha}" \
            --head-sha "${head_sha}" \
            --source-head-sha "${source_head_sha}" \
            --tested-sha "${tested_sha}" \
            --tested-ref "${tested_ref}" \
            --tested-ref-kind "${tested_ref_kind}" \
            "${draft_args[@]}" "${full_suite_args[@]}" "${label_args[@]}")"
          has_suite() { jq -r --arg name "$1" '((.selected_test_suites | index($name)) != null)' <<<"${plan_json}"; }
          has_gate() { jq -r --arg name "$1" '((.selected_gates | index($name)) != null)' <<<"${plan_json}"; }
          firmware_compile="$(jq -r 'any(.selected_gates[]; . == "firmware_quick" or . == "firmware_affected" or . == "firmware_full_matrix")' <<<"${plan_json}")"
          test "$(has_gate secret_scan)" = "true"
          test "$(jq -r .no_heavy_impact_duplicates <<<"${plan_json}")" = "true"
          if [ "$(jq -r .ci_mode <<<"${plan_json}")" = "full" ]; then
            test "$(jq -r .full_plan_complete <<<"${plan_json}")" = "true"
            test "$(has_gate actionlint)" = "true"
          fi
          {
            echo "ci_mode=$(jq -r .ci_mode <<<"${plan_json}")"
            echo "selected_test_suites=$(jq -c .selected_test_suites <<<"${plan_json}")"
            echo "selected_gates=$(jq -c .selected_gates <<<"${plan_json}")"
            echo "skipped_gates=$(jq -c .skipped_gates <<<"${plan_json}")"
            echo "plan_json=${plan_json}"
            echo "source_head_sha=${source_head_sha}"
            echo "base_sha=${base_sha}"
            echo "tested_sha=${tested_sha}"
            echo "tested_ref=${tested_ref}"
            echo "tested_ref_kind=${tested_ref_kind}"
            echo "run_python_quality=$(has_suite ruff)"
            echo "run_dependency_policy=$(has_suite dependency_policy)"
            echo "selected_owner_suites=$(jq -c .selected_owner_suites <<<"${plan_json}")"
            echo "run_python312_full=$(has_gate python312_full)"
            echo "run_python310=$(has_gate python310_compatibility)"
            echo "run_dependency_audit=$(has_gate dependency_audit)"
            echo "run_migration=$(has_suite migration_owner)"
            echo "run_secret_scan=$(has_gate secret_scan)"
            echo "run_actionlint=$(has_gate actionlint)"
            echo "run_lan_persistence=$(has_gate docker_lan_persistence)"
            echo "run_tls_smoke=$(has_gate tls_smoke)"
            echo "run_runtime_soak=$(has_gate runtime_soak)"
            echo "run_playwright=$(has_gate playwright)"
            echo "run_firmware_host_contract=$(has_gate firmware_host_contract)"
            echo "run_firmware_compile=${firmware_compile}"
            echo "run_benchmark=$(has_gate benchmark)"
            echo "run_container_security=$(has_gate container_security)"
            echo "run_source_head_contract=$(jq -r .requires_source_head_contract <<<"${plan_json}")"
            echo "firmware_execution_profiles=$(jq -c .firmware_execution_profiles <<<"${plan_json}")"
            echo "full_plan_complete=$(jq -r .full_plan_complete <<<"${plan_json}")"
            echo "no_heavy_impact_duplicates=$(jq -r .no_heavy_impact_duplicates <<<"${plan_json}")"
          } >> "${GITHUB_OUTPUT}"
          mkdir -p artifacts
          jq '{event_name, ref, source_head_sha, base_sha, tested_sha, tested_ref, tested_ref_kind}' \
            <<<"${plan_json}" > "artifacts/ci-provenance-${GITHUB_RUN_ID}.json"
          {
            echo "### Canonical CI test plan"
            echo "- Mode: $(jq -r .ci_mode <<<"${plan_json}")"
            echo "- SOURCE_HEAD_SHA: $(jq -r .source_head_sha <<<"${plan_json}")"
            echo "- BASE_SHA: $(jq -r .base_sha <<<"${plan_json}")"
            echo "- TESTED_SHA: $(jq -r .tested_sha <<<"${plan_json}")"
            echo "- TESTED_REF: $(jq -r .tested_ref <<<"${plan_json}")"
            echo "- TESTED_REF_KIND: $(jq -r .tested_ref_kind <<<"${plan_json}")"
            echo "- Full plan complete: $(jq -r .full_plan_complete <<<"${plan_json}")"
            echo "- No heavy impact duplicates: $(jq -r .no_heavy_impact_duplicates <<<"${plan_json}")"
            echo "- Selected gates: $(jq -c .selected_gates <<<"${plan_json}")"
            echo "- Skipped gates: $(jq -c .skipped_gates <<<"${plan_json}")"
            if [ "${tested_ref_kind}" = "merge-ref" ]; then
              echo "- Validation semantics: this workflow tests the PR merge result; SOURCE_HEAD_SHA is recorded separately."
            fi
            echo '```json'
            jq . <<<"${plan_json}"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"
      - name: Upload provenance metadata
        if: ${{ steps.event.outputs.full_validation == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: inktime-ci-provenance-${{ github.run_id }}
          path: artifacts/ci-provenance-${{ github.run_id }}.json
          if-no-files-found: error
          retention-days: 14

  source-head-contract:
    name: PR source-head provenance contract
    if: ${{ needs.changes.outputs.full_validation == 'true' && needs.changes.outputs.run_source_head_contract == 'true' }}
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node 24)
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Verify declared PR source HEAD provenance
        env:
          SOURCE_HEAD_SHA: ${{ needs.changes.outputs.source_head_sha }}
          BASE_SHA: ${{ needs.changes.outputs.base_sha }}
        run: |
          set -euo pipefail
          tested_sha="$(git rev-parse HEAD)"
          tested_ref="${SOURCE_HEAD_SHA}"
          test "${tested_sha}" = "${SOURCE_HEAD_SHA}"
          mkdir -p artifacts
          jq -n \
            --arg event_name "pull_request" \
            --arg ref "${GITHUB_REF}" \
            --arg tested_ref "${tested_ref}" \
            --arg source_head_sha "${SOURCE_HEAD_SHA}" \
            --arg base_sha "${BASE_SHA}" \
            --arg tested_sha "${tested_sha}" \
            --arg tested_ref_kind "head" \
            '$ARGS.named' \
            > "artifacts/source-head-provenance-${GITHUB_RUN_ID}.json"
          {
            echo "### PR source-head evidence"
            echo "- SOURCE_HEAD_SHA: ${SOURCE_HEAD_SHA}"
            echo "- BASE_SHA: ${BASE_SHA}"
            echo "- TESTED_SHA: ${tested_sha}"
            echo "- TESTED_REF: ${tested_ref}"
            echo "- TESTED_REF_KIND: head"
            echo "- Scope: lightweight source-head provenance only; expensive PR validation remains on merge-ref."
          } >> "${GITHUB_STEP_SUMMARY}"
      - name: Upload source-head provenance
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: inktime-source-head-provenance-${{ github.run_id }}
          path: artifacts/source-head-provenance-${{ github.run_id }}.json
          if-no-files-found: error
          retention-days: 14

  python-quality:
    name: Python 3.12 T0 and full coverage
    if: ${{ needs.changes.outputs.full_validation == 'true' && needs.changes.outputs.run_python_quality == 'true' }}
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node 24)
        with: {fetch-depth: 0}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0 (Node 24)
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements-dev.txt
      - name: Dependency policy
        run: python scripts/check_dependency_policy.py
      - name: Planner hardening contracts
        run: >-
          pytest
          tests/unit/test_ci_changed_paths.py
          tests/unit/test_ci_test_plan.py
          tests/unit/test_ci_selected_suites.py
          tests/unit/test_dependency_policy.py
          tests/unit/test_ci_execution_attestation.py
          tests/unit/test_ci_verify_execution.py
          tests/unit/test_ci_provenance.py
          tests/unit/test_ci_planner_hardening.py
          tests/unit/test_ci_workflow_events.py
      - name: Ruff
        run: ruff check inktime tests scripts server.py analyze_photos.py
      - name: Mypy
        run: mypy
      - name: Git diff check
        run: git diff --check
      - name: Python 3.12 full coverage >= 80%
        if: ${{ needs.changes.outputs.run_python312_full == 'true' }}
        run: pytest --cov=inktime --cov-config=pyproject.toml --cov-report=term-missing --cov-fail-under=80 tests/unit tests/security tests/integration

  python-compatibility:
    name: Python 3.10 compatibility
    if: ${{ needs.changes.outputs.full_validation == 'true' && needs.changes.outputs.run_python310 == 'true' }}
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node 24)
        with: {fetch-depth: 0}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0 (Node 24)
        with: {python-version: "3.10", cache: pip}
      - run: pip install -r requirements-dev.txt
      - run: pytest tests/unit tests/security tests/integration

  dependency-audit:
    name: Dependency policy and audit
    if: ${{ needs.changes.outputs.full_validation == 'true' && needs.changes.outputs.run_dependency_audit == 'true' }}
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node 24)
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0 (Node 24)
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements-dev.txt
      - run: python scripts/check_dependency_policy.py
      - run: pip-audit -r requirements.txt

  migration-contract:
    name: Migration contract
    if: ${{ needs.changes.outputs.full_validation == 'true' && needs.changes.outputs.run_migration == 'true' }}
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node 24)
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0 (Node 24)
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements-dev.txt
      - run: pytest tests/unit/test_migrations.py

  secret-scan:
    if: ${{ needs.changes.outputs.full_validation == 'true' && needs.changes.outputs.run_secret_scan == 'true' }}
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node 24)
        with: {fetch-depth: 0}
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0 (Node 24)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  actionlint:
    name: Actionlint workflow contract
    if: ${{ needs.changes.outputs.full_validation == 'true' && needs.changes.outputs.run_actionlint == 'true' }}
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node 24)
        with: {fetch-depth: 0}
      - name: Run pinned actionlint
        run: |
          # actionlint v1.7.7; digest verified from the registry manifest.
          docker run --rm \
            -v "${PWD}:/repo:ro" \
            -w /repo \
            rhysd/actionlint@sha256:1d74bfc9fd1963af8f89a7c22afaaafd42f49aad711a09951d02cb996398f61d

  selected-owner-suites:
    name: Selected owner suites
    if: ${{ needs.changes.outputs.full_validation == 'true' && needs.changes.outputs.ci_mode == 'impact' && needs.changes.outputs.selected_owner_suites != '[]' }}
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node 24)
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0 (Node 24)
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements-dev.txt
      - name: Run planner-selected owner regressions
        env:
          SELECTED_TEST_SUITES: ${{ needs.changes.outputs.selected_test_suites }}
        run: python scripts/ci/run_selected_suites.py --suites-json "${SELECTED_TEST_SUITES}"

  compose-lan-production-persistence:
    if: ${{ needs.changes.outputs.full_validation == 'true' && needs.changes.outputs.run_lan_persistence == 'true' }}
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node 24)
      - name: Prepare isolated production smoke environment
        run: |
          mkdir -p .ci-data .ci-photos
          chmod 777 .ci-data
          ci_root=$(pwd)
          revision=$(git rev-parse HEAD)
          build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          cat > .ci-lan.env <<EOF
          TZ=Asia/Taipei
          INKTIME_PORT=8765
          INKTIME_DATA_PATH=${ci_root}/.ci-data
          INKTIME_PHOTO_PATH=${ci_root}/.ci-photos
          INKTIME_ENVIRONMENT=production
          INKTIME_PUBLIC_URL=http://inktime-lan.test:8765
          INKTIME_COOKIE_SECURE=0
          INKTIME_ALLOW_INSECURE_HTTP=1
          INKTIME_ALLOW_UNSAFE_NETWORK_DATABASE=0
          INKTIME_PROXY_TRUST=0
          INKTIME_LAN_TEST_MODE=1
          INKTIME_IMAGE_TAG=ci-lan
          INKTIME_GIT_REVISION=${revision}
          INKTIME_BUILD_TIME=${build_time}
          EOF
          chmod 600 .ci-lan.env
          python scripts/production_preflight.py --mode lan --env-file .ci-lan.env
      - name: Build and start Web, Worker and Scheduler
        run: docker compose --env-file .ci-lan.env up -d --build
      - name: Wait for all service healthchecks
        run: |
          timeout 180 sh -c '
            until
              curl -fsS http://127.0.0.1:8765/health/ready >/dev/null &&
              docker compose --env-file .ci-lan.env exec -T inktime-worker python scripts/container_health.py worker &&
              docker compose --env-file .ci-lan.env exec -T inktime-scheduler python scripts/container_health.py scheduler
            do sleep 2; done
          '
      - name: Initialize LAN setup, session, setting and automatic pairing
        run: python scripts/lan_production_gate.py initialize --state .ci-lan-state.json
      - name: Seed one deterministic formal Release while services are stopped
        run: |
          docker compose --env-file .ci-lan.env stop
          sudo chown -R "$(id -u):$(id -g)" .ci-data
          python scripts/lan_production_gate.py seed-release --state .ci-lan-state.json --data-dir .ci-data
          sudo chown -R 10001:10001 .ci-data
          docker compose --env-file .ci-lan.env start
          timeout 180 sh -c 'until curl -fsS http://127.0.0.1:8765/health/ready >/dev/null; do sleep 2; done'
      - name: Exercise Latest, Queue, ACK, same-content status and Backup
        run: python scripts/lan_production_gate.py exercise --state .ci-lan-state.json
      - name: Verify docker compose restart persistence
        run: |
          docker compose --env-file .ci-lan.env restart
          timeout 180 sh -c 'until curl -fsS http://127.0.0.1:8765/health/ready >/dev/null; do sleep 2; done'
          python scripts/lan_production_gate.py verify --state .ci-lan-state.json
      - name: Verify down and up with the same persistent storage
        run: |
          docker compose --env-file .ci-lan.env down --remove-orphans
          docker compose --env-file .ci-lan.env up -d
          timeout 180 sh -c 'until curl -fsS http://127.0.0.1:8765/health/ready >/dev/null; do sleep 2; done'
          python scripts/lan_production_gate.py verify --state .ci-lan-state.json
      - name: Verify offline integrity, mutate, then restore the validated Backup
        run: |
          docker compose --env-file .ci-lan.env stop
          sudo chown -R "$(id -u):$(id -g)" .ci-data
          python scripts/lan_production_gate.py offline-verify --state .ci-lan-state.json --data-dir .ci-data
          python scripts/lan_production_gate.py mutate --state .ci-lan-state.json --data-dir .ci-data
          backup_name=$(python -c 'import json; print(json.load(open(".ci-lan-state.json"))["backup_name"])')
          sudo chown -R 10001:10001 .ci-data
          docker compose --env-file .ci-lan.env run --rm --no-deps inktime-web \
            python scripts/restore_backup.py "/data/backups/${backup_name}" --yes
          docker compose --env-file .ci-lan.env up -d
          timeout 180 sh -c 'until curl -fsS http://127.0.0.1:8765/health/ready >/dev/null; do sleep 2; done'
          python scripts/lan_production_gate.py verify --state .ci-lan-state.json
          docker compose --env-file .ci-lan.env stop
          sudo chown -R "$(id -u):$(id -g)" .ci-data
          python scripts/lan_production_gate.py offline-verify --state .ci-lan-state.json --data-dir .ci-data
      - name: Verify runtime identity, permissions and image contents
        run: |
          docker compose --env-file .ci-lan.env start inktime-web
          docker compose --env-file .ci-lan.env exec -T inktime-web sh -c '
            test "$(id -u)" = 10001
            test -w /data
            ! touch /app/.ci-write-test
            ! python -m pip --version
            test ! -e /app/tests
            test ! -e /app/.github
            test ! -e /app/docs
            test ! -e /app/.env
            test ! -e /app/esp32
          '
      - name: Collect Compose diagnostics
        if: failure()
        run: |
          docker compose --env-file .ci-lan.env ps
          docker compose --env-file .ci-lan.env logs --no-color
          docker compose --env-file .ci-lan.env ps --format json
      - name: Remove smoke volumes and containers
        if: always()
        run: |
          docker compose --env-file .ci-lan.env down -v --remove-orphans
          sudo rm -rf .ci-data .ci-photos .ci-lan.env .ci-lan-state.json

  compose-production-tls-smoke:
    if: ${{ needs.changes.outputs.full_validation == 'true' && needs.changes.outputs.run_tls_smoke == 'true' }}
    needs: changes
    runs-on: ubuntu-latest
    env:
      NO_PROXY: inktime-ci.acme.dev,127.0.0.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node 24)
      - name: Create isolated test CA and server certificate
        shell: bash
        run: |
          mkdir -p .ci-data .ci-photos .ci-tls
          chmod 777 .ci-data
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -subj '/CN=InkTime CI Test CA' \
            -keyout .ci-tls/ca.key -out .ci-tls/ca.crt
          openssl req -newkey rsa:2048 -nodes \
            -subj '/CN=inktime-ci.acme.dev' \
            -keyout .ci-tls/server.key -out .ci-tls/server.csr
          printf 'subjectAltName=DNS:inktime-ci.acme.dev\nextendedKeyUsage=serverAuth\n' > .ci-tls/server.ext
          openssl x509 -req -days 1 -sha256 \
            -in .ci-tls/server.csr -CA .ci-tls/ca.crt -CAkey .ci-tls/ca.key \
            -CAcreateserial -extfile .ci-tls/server.ext -out .ci-tls/server.crt
          echo '127.0.0.1 inktime-ci.acme.dev' | sudo tee -a /etc/hosts
          cat > .ci-tls.env <<'EOF'
          TZ=Asia/Taipei
          INKTIME_DATA_PATH=.ci-data
          INKTIME_PHOTO_PATH=.ci-photos
          INKTIME_ENVIRONMENT=production
          INKTIME_PUBLIC_URL=https://inktime-ci.acme.dev:8443
          INKTIME_COOKIE_SECURE=1
          INKTIME_ALLOW_INSECURE_HTTP=0
          INKTIME_ALLOW_UNSAFE_NETWORK_DATABASE=0
          INKTIME_PROXY_TRUST=1
          INKTIME_IMAGE_TAG=ci-tls
          EOF
      - name: Build and start production services behind TLS proxy
        run: docker compose --env-file .ci-tls.env -f docker-compose.yml -f .github/tls-smoke/docker-compose.tls.yml up -d --build
      - name: Wait for verified HTTPS readiness
        run: |
          timeout 180 sh -c '
            until curl --fail --silent --show-error \
              --cacert .ci-tls/ca.crt \
              --resolve inktime-ci.acme.dev:8443:127.0.0.1 \
              https://inktime-ci.acme.dev:8443/health/ready >/dev/null
            do sleep 2; done
          '
          if curl --fail --silent http://127.0.0.1:8765/health/live; then
            echo 'Backend port must not be published in TLS topology' >&2
            exit 1
          fi
      - name: Verify redirect, trusted TLS, cookies, CSRF, session, HSTS and proxy diagnostics
        env:
          INKTIME_TLS_SMOKE_CA: .ci-tls/ca.crt
          INKTIME_TLS_SMOKE_URL: https://inktime-ci.acme.dev:8443
          INKTIME_TLS_SMOKE_HTTP_URL: http://inktime-ci.acme.dev:8080
        run: python scripts/production_tls_smoke.py
      - name: Collect TLS Compose diagnostics
        if: failure()
        run: |
          docker compose --env-file .ci-tls.env -f docker-compose.yml -f .github/tls-smoke/docker-compose.tls.yml ps
          docker compose --env-file .ci-tls.env -f docker-compose.yml -f .github/tls-smoke/docker-compose.tls.yml logs --no-color
      - name: Remove TLS smoke volumes, containers and certificates
        if: always()
        run: |
          docker compose --env-file .ci-tls.env -f docker-compose.yml -f .github/tls-smoke/docker-compose.tls.yml down -v --remove-orphans
          sudo rm -rf .ci-tls .ci-data .ci-photos

  bounded-runtime-soak:
    if: ${{ needs.changes.outputs.full_validation == 'true' && needs.changes.outputs.run_runtime_soak == 'true' }}
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node 24)
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0 (Node 24)
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements-dev.txt
      - run: mkdir -p .artifacts && timeout 240 python scripts/runtime_soak.py --max-iterations 30 --timeout-seconds 180 --summary-json .artifacts/runtime-soak-bounded.json
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 (Node 24)
        with:
          name: runtime-soak-bounded-summary
          path: .artifacts/runtime-soak-bounded.json
          if-no-files-found: error

  playwright:
    if: ${{ needs.changes.outputs.full_validation == 'true' && needs.changes.outputs.run_playwright == 'true' }}
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node 24)
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0 (Node 24)
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements-e2e.txt
      - run: playwright install --with-deps chromium
      - run: mkdir -p .ci-e2e && INKTIME_DATA_DIR=.ci-e2e INKTIME_DATABASE=.ci-e2e/inktime.db gunicorn --bind 127.0.0.1:8765 server:app &
      - run: timeout 60 sh -c 'until curl -fsS http://127.0.0.1:8765/health/live; do sleep 1; done'
      - run: INKTIME_E2E_URL=http://127.0.0.1:8765 pytest tests/e2e

  firmware-host-contract:
    if: ${{ needs.changes.outputs.full_validation == 'true' && needs.changes.outputs.run_firmware_host_contract == 'true' }}
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node 24)
      - name: Test crash-consistent device Config core
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror -pedantic \
            -Iesp32/ink-display-7C-photo \
            tests/firmware/test_device_config_store_core.cpp \
            -o /tmp/inktime-device-config-store-core
          /tmp/inktime-device-config-store-core
          c++ -std=c++17 -Wall -Wextra -Werror -pedantic \
            -Iesp32/ink-display-7C-photo \
            tests/firmware/test_pairing_recovery_core.cpp \
            -o /tmp/inktime-pairing-recovery-core
          /tmp/inktime-pairing-recovery-core
          c++ -std=c++17 -Wall -Wextra -Werror -pedantic \
            -Iesp32/ink-display-7C-photo \
            tests/firmware/test_photopainter_core.cpp \
            -o /tmp/inktime-photopainter-core-default
          /tmp/inktime-photopainter-core-default
          c++ -std=c++17 -Wall -Wextra -Werror -pedantic \
            -DDEVICE_PROFILE=DEVICE_PROFILE_WAVESHARE_PHOTOPAINTER \
            -Iesp32/ink-display-7C-photo \
            tests/firmware/test_photopainter_core.cpp \
            -o /tmp/inktime-photopainter-core-photopainter
          /tmp/inktime-photopainter-core-photopainter
          c++ -std=c++17 -Wall -Wextra -Werror -pedantic \
            -Iesp32/ink-display-7C-photo \
            tests/firmware/test_queue_client_core.cpp \
            -o /tmp/inktime-queue-client-core
          /tmp/inktime-queue-client-core
          c++ -std=c++17 -Wall -Wextra -Werror -pedantic \
            -Iesp32/ink-display-7C-photo \
            tests/firmware/test_ack_journal_transaction_core.cpp \
            -o /tmp/inktime-ack-journal-transaction-core
          /tmp/inktime-ack-journal-transaction-core
          c++ -std=c++17 -Wall -Wextra -Werror -pedantic \
            -Iesp32/ink-display-7C-photo \
            tests/firmware/test_ack_journal_storage_budget.cpp \
            -o /tmp/inktime-ack-journal-storage-budget
          /tmp/inktime-ack-journal-storage-budget

  esp32-compile:
    if: ${{ needs.changes.outputs.full_validation == 'true' && needs.changes.outputs.run_firmware_compile == 'true' }}
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node 24)
      - name: Install pinned Arduino CLI
        env:
          ARDUINO_CLI_VERSION: "1.5.1"
          ARDUINO_CLI_SHA256: "28a8e119c498a25607821c36cb2dc49e8463941b261a0d99091baa7bc692dd2b"
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/arduino-cli_${ARDUINO_CLI_VERSION}_Linux_64bit.tar.gz"
          curl --fail --silent --show-error --location --retry 3 \
            --output "${archive}" \
            "https://github.com/arduino/arduino-cli/releases/download/v${ARDUINO_CLI_VERSION}/arduino-cli_${ARDUINO_CLI_VERSION}_Linux_64bit.tar.gz"
          printf '%s  %s\n' "${ARDUINO_CLI_SHA256}" "${archive}" | sha256sum --check --strict
          tar --extract --gzip --file="${archive}" --directory="${RUNNER_TEMP}"
          chmod 0755 "${RUNNER_TEMP}/arduino-cli"
          printf '%s\n' "${RUNNER_TEMP}" >> "${GITHUB_PATH}"
      - run: arduino-cli config init
      - run: arduino-cli core update-index && arduino-cli core install esp32:esp32@3.3.10
      - run: arduino-cli lib install GxEPD2@1.6.9 ArduinoJson@7.4.3
      - name: Compile planner-selected firmware profiles
        env:
          FIRMWARE_EXECUTION_PROFILES: ${{ needs.changes.outputs.firmware_execution_profiles }}
        run: |
          set -euo pipefail
          sketch_dir="esp32/ink-display-7C-photo"
          trap 'rm -f "${sketch_dir}/partitions.csv"' EXIT
          select_partition() {
            cp "${sketch_dir}/$1" "${sketch_dir}/partitions.csv"
          }
          mapfile -t profiles < <(jq -r '.quick[], .affected[], .full_matrix[]' <<<"${FIRMWARE_EXECUTION_PROFILES}")
          test "${#profiles[@]}" -gt 0
          for profile in "${profiles[@]}"; do
            case "${profile}" in
              gdey_release)
                select_partition inktime_default_4M.csv
                arduino-cli compile --fqbn 'esp32:esp32:esp32s3:FlashSize=4M' --build-property 'upload.maximum_size=1376256' --build-path /tmp/build-gdey-release esp32/ink-display-7C-photo
                ;;
              gdep_release)
                select_partition inktime_default_4M.csv
                arduino-cli compile --fqbn 'esp32:esp32:esp32s3:FlashSize=4M' --build-property 'upload.maximum_size=1376256' --build-property 'compiler.cpp.extra_flags=-DINKTIME_PANEL_GDEP073E01=1' --build-path /tmp/build-gdep-release esp32/ink-display-7C-photo
                ;;
              photopainter_release)
                select_partition inktime_photopainter_3M_16MB.csv
                arduino-cli compile --fqbn 'esp32:esp32:esp32s3:FlashSize=16M,PSRAM=opi,CDCOnBoot=cdc' --build-property 'upload.maximum_size=3145728' --build-property 'compiler.cpp.extra_flags=-DDEVICE_PROFILE=DEVICE_PROFILE_WAVESHARE_PHOTOPAINTER' --build-path /tmp/build-photopainter-release esp32/ink-display-7C-photo
                ;;
              trusted_lan_gdey)
                select_partition inktime_default_4M.csv
                arduino-cli compile --fqbn 'esp32:esp32:esp32s3:FlashSize=4M' --build-property 'upload.maximum_size=1376256' --build-property 'compiler.cpp.extra_flags=-DINKTIME_ALLOW_INSECURE_DEVICE_HTTP=1' --build-path /tmp/build-trusted-lan-gdey esp32/ink-display-7C-photo
                ;;
              trusted_lan_gdep)
                select_partition inktime_default_4M.csv
                arduino-cli compile --fqbn 'esp32:esp32:esp32s3:FlashSize=4M' --build-property 'upload.maximum_size=1376256' --build-property 'compiler.cpp.extra_flags=-DINKTIME_PANEL_GDEP073E01=1 -DINKTIME_ALLOW_INSECURE_DEVICE_HTTP=1' --build-path /tmp/build-trusted-lan-gdep esp32/ink-display-7C-photo
                ;;
              trusted_lan_photopainter)
                select_partition inktime_photopainter_3M_16MB.csv
                arduino-cli compile --fqbn 'esp32:esp32:esp32s3:FlashSize=16M,PSRAM=opi,CDCOnBoot=cdc' --build-property 'upload.maximum_size=3145728' --build-property 'compiler.cpp.extra_flags=-DDEVICE_PROFILE=DEVICE_PROFILE_WAVESHARE_PHOTOPAINTER -DINKTIME_ALLOW_INSECURE_DEVICE_HTTP=1' --build-path /tmp/build-trusted-lan-photopainter esp32/ink-display-7C-photo
                ;;
              default_debug)
                select_partition inktime_default_4M.csv
                arduino-cli compile --fqbn 'esp32:esp32:esp32s3:FlashSize=4M,DebugLevel=debug' --build-property 'upload.maximum_size=1376256' --build-property 'compiler.cpp.extra_flags=-DINKTIME_DEBUG_LOG=1' --build-path /tmp/build-default-debug esp32/ink-display-7C-photo
                ;;
              photopainter_debug)
                select_partition inktime_photopainter_3M_16MB.csv
                arduino-cli compile --fqbn 'esp32:esp32:esp32s3:FlashSize=16M,PSRAM=opi,CDCOnBoot=cdc,DebugLevel=debug' --build-property 'upload.maximum_size=3145728' --build-property 'compiler.cpp.extra_flags=-DDEVICE_PROFILE=DEVICE_PROFILE_WAVESHARE_PHOTOPAINTER -DINKTIME_DEBUG_LOG=1' --build-path /tmp/build-photopainter-debug esp32/ink-display-7C-photo
                ;;
              *)
                echo "Unknown planner firmware profile: ${profile}" >&2
                exit 1
                ;;
            esac
          done

  repository-gate:
    name: ${{ needs.changes.outputs.full_validation == 'true' && 'Repository gate' || 'Metadata event gate' }}
    if: ${{ always() }}
    needs:
      - changes
      - source-head-contract
      - secret-scan
      - actionlint
      - selected-owner-suites
      - python-quality
      - python-compatibility
      - dependency-audit
      - migration-contract
      - compose-lan-production-persistence
      - compose-production-tls-smoke
      - bounded-runtime-soak
      - playwright
      - firmware-host-contract
      - esp32-compile
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail when event classification failed
        if: ${{ needs.changes.result != 'success' }}
        run: exit 1
      - if: ${{ needs.changes.outputs.full_validation == 'true' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node 24)
        with: {fetch-depth: 1}
      - name: Verify planner-selected execution attestation
        if: ${{ needs.changes.outputs.full_validation == 'true' }}
        env:
          PLAN_JSON: ${{ needs.changes.outputs.plan_json }}
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          python scripts/ci/verify_execution.py \
            --plan-json "${PLAN_JSON}" \
            --needs-json "${NEEDS_JSON}" \
            --workflow repository
      - name: Accept metadata-only pull request edit
        if: ${{ needs.changes.outputs.full_validation != 'true' && needs.changes.result == 'success' }}
        run: echo "Metadata-only edit classified without creating Repository gate validation evidence."
