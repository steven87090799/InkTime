name: InkTime Container Security and Benchmark Contracts

on:
  pull_request:
    branches:
      - main
      - fix/final-production-openrouter-and-runtime-hardening
    # Base retargets need validation; title/body-only edits use the metadata lane below.
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled, edited]
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      full_suite:
        description: Run every hosted validation tier
        required: false
        default: true
        type: boolean

concurrency:
  group: inktime-container-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name == 'pull_request' && github.event.action == 'edited' && github.event.changes.base == null && 'metadata-only' || 'validation' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Classify changed paths
    runs-on: ubuntu-latest
    outputs:
      full_validation: ${{ steps.event.outputs.full_validation }}
      docker: ${{ steps.route.outputs.docker }}
      tls_security: ${{ steps.route.outputs.tls_security }}
      provider_ai: ${{ steps.route.outputs.provider_ai }}
      benchmark: ${{ steps.route.outputs.benchmark }}
      dependencies: ${{ steps.route.outputs.dependencies }}
      ci_config: ${{ steps.route.outputs.ci_config }}
      full_suite: ${{ steps.route.outputs.full_suite }}
    steps:
      - id: event
        name: Classify workflow event
        env:
          FULL_VALIDATION: ${{ github.event_name != 'pull_request' || github.event.action != 'edited' || github.event.changes.base != null }}
        run: echo "full_validation=${FULL_VALIDATION}" >> "${GITHUB_OUTPUT}"
      - if: ${{ steps.event.outputs.full_validation == 'true' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node 24)
        with: {fetch-depth: 0}
      - id: route
        name: Emit source-owned routing flags
        if: ${{ steps.event.outputs.full_validation == 'true' }}
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          FORCE_FULL_SUITE: ${{ inputs.full_suite || github.ref == 'refs/heads/main' || contains(github.event.pull_request.labels.*.name, 'full-ci') }}
        run: |
          set -euo pipefail
          base_sha="${BASE_SHA:-}"
          if [ -z "${base_sha}" ]; then base_sha="$(git rev-parse HEAD^)"; fi
          full_suite_arg=""
          if [ "${FORCE_FULL_SUITE}" = "true" ]; then full_suite_arg="--full-suite"; fi
          python scripts/ci/changed_paths.py \
            --base "${base_sha}" \
            --head "${HEAD_SHA}" \
            ${full_suite_arg} >> "${GITHUB_OUTPUT}"

  container-security:
    if: ${{ needs.changes.outputs.full_validation == 'true' && (needs.changes.outputs.full_suite == 'true' || needs.changes.outputs.docker == 'true' || needs.changes.outputs.dependencies == 'true' || needs.changes.outputs.ci_config == 'true') }}
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node 24)
        with: {fetch-depth: 0}
      - name: Build exact checkout image
        run: docker build --pull --tag inktime:ci .
      - name: Generate CycloneDX SBOM
        run: |
          mkdir -p artifacts
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "${PWD}/artifacts:/artifacts" \
            anchore/syft:v1.18.1 inktime:ci \
            -o cyclonedx-json=/artifacts/inktime-sbom-${GITHUB_SHA}.json
      - name: Scan image for HIGH and CRITICAL vulnerabilities
        id: trivy
        shell: bash
        run: |
          set +e
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "${PWD}/artifacts:/artifacts" \
            -v "${PWD}/.trivyignore:/trivyignore:ro" \
            aquasec/trivy:0.60.0 image \
            --format json \
            --output "/artifacts/inktime-trivy-${GITHUB_SHA}.json" \
            --ignorefile /trivyignore \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            inktime:ci
          status=$?
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "${PWD}/artifacts:/artifacts" \
            -v "${PWD}/.trivyignore:/trivyignore:ro" \
            aquasec/trivy:0.60.0 image \
            --format table \
            --output "/artifacts/inktime-trivy-${GITHUB_SHA}.txt" \
            --ignorefile /trivyignore \
            --severity HIGH,CRITICAL \
            --exit-code 0 \
            inktime:ci
          exit "$status"
      - name: Upload SBOM and Trivy evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 (Node 24)
        with:
          name: inktime-container-security-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14

  benchmark-contract:
    if: ${{ needs.changes.outputs.full_validation == 'true' && (needs.changes.outputs.full_suite == 'true' || needs.changes.outputs.benchmark == 'true' || needs.changes.outputs.provider_ai == 'true') }}
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node 24)
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0 (Node 24)
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt
      - name: Run bounded offline benchmark contract
        run: |
          mkdir -p artifacts
          python scripts/benchmark_models.py \
            --sample-count 2 \
            --output "artifacts/model-benchmark-${GITHUB_SHA}.json" \
            --markdown-output "artifacts/model-benchmark-${GITHUB_SHA}.md"
      - name: Upload offline benchmark evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 (Node 24)
        with:
          name: inktime-offline-benchmark-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14

  container-security-gate:
    name: Container security gate
    if: ${{ always() }}
    needs:
      - changes
      - container-security
      - benchmark-contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail when a routed container check failed or was cancelled
        if: ${{ needs.changes.result != 'success' || contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          echo "A routed container or benchmark check failed or was cancelled." >&2
          exit 1
      - name: Accept skipped checks as intentional routing
        run: echo "Container and benchmark routing completed."
