services:
  inktime-web:
    ports: !reset []

  inktime-tls-proxy:
    image: nginx:1.28.0-alpine
    depends_on:
      inktime-web:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:80"
      - "127.0.0.1:8443:443"
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=16m
      - /var/run:size=1m
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./.github/tls-smoke/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./.ci-tls:/etc/nginx/tls:ro

