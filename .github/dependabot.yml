version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "02:00"
      timezone: Asia/Taipei
    open-pull-requests-limit: 2
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "02:30"
      timezone: Asia/Taipei
    open-pull-requests-limit: 2
    groups:
      dev-tools:
        dependency-type: development
        patterns:
          - pytest
          - pytest-cov
          - ruff
          - mypy
          - types-*
          - pip-audit
          - playwright
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: opencv-python-headless
        update-types:
          - version-update:semver-major
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
      timezone: Asia/Taipei
    open-pull-requests-limit: 1
    ignore:
      - dependency-name: python
        versions:
          - ">=3.13"
